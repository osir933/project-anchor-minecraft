pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'anchor'

// The simulation core: plain Java, no Minecraft code, buildable anywhere.
include 'anchor-core'

// The NeoForge mod needs Mojang's and NeoForged's servers to set up Minecraft.
// Pass -Panchor.coreOnly=true to build and test only the core on machines without that access.
def coreOnly = providers.gradleProperty('anchor.coreOnly').map { it.toBoolean() }.getOrElse(false)
if (!coreOnly) {
    include 'anchor-neoforge'
}
