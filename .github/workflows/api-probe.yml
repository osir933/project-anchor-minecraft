name: API probe

on:
  push:
    branches: [claude/api-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile and unit test the mod
        run: ./gradlew :anchor-neoforge:compileJava :anchor-neoforge:test --stacktrace -q
      - name: Render test
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
          log="$RUNNER_TEMP/render.log"
          code=0
          timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :anchor-neoforge:runRenderTest \
            --stacktrace --warning-mode all > "$log" 2>&1 || code=$?
          echo "game ended with $code"
          grep -E 'ANCHOR RENDER TEST|Exception|/ERROR\]|backend' "$log" | grep -v ALSA | head -80 || true
          for f in anchor-neoforge/build/render-test/anchor-render-test/*.png; do
            echo "--- $f"; python3 .github/probe/png_grid.py "$f" 96 54
          done
          python3 .github/scripts/render_check.py anchor-neoforge/build/render-test/anchor-render-test || true
          echo "--- last lines"
          tail -40 "$log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: probe-render
          path: anchor-neoforge/build/render-test/anchor-render-test/
          if-no-files-found: ignore
