name: API probe

on:
  push:
    branches: [claude/api-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Prepare the game classes
        run: ./gradlew :anchor-neoforge:compileJava --stacktrace -q
      - name: Print signatures
        run: ./.github/probe/probe.sh
