name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # v5 is the last MIT-licensed major; v6 moved caching under Gradle's proprietary terms.
      - uses: gradle/actions/setup-gradle@v5

      - name: Script tests
        run: python3 -m unittest discover -s .github/scripts

      - name: Build and test
        run: ./gradlew build --stacktrace --warning-mode all

      # Starts a server with the mod and runs its game tests. The log check makes sure tests really ran:
      # a server that found none would otherwise pass.
      - name: Game tests
        run: |
          set -o pipefail
          ./gradlew :anchor-neoforge:runGameTestServer --stacktrace --warning-mode all 2>&1 | tee "$RUNNER_TEMP/gametest.log"
          grep -E 'All [1-9][0-9]* required tests passed' "$RUNNER_TEMP/gametest.log"

      # The game tests run in the development setup, which never uses the jar. This installs a NeoForge server
      # the way players do, starts it with the jar in its mods folder and checks that Anchor works there.
      - name: Smoke test the jar
        run: python3 .github/scripts/smoke_test.py --dir "$RUNNER_TEMP/server"

      # Starts the game itself under a virtual display, with software drawing. The mod's render test heats two iron
      # blocks in a dark room and photographs them hot and cooled; the check makes sure they glowed where they are,
      # in a black body's colours, and stopped once cooled.
      - name: Render test
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
          log="$RUNNER_TEMP/render.log"
          code=0
          timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :anchor-neoforge:runRenderTest \
            --stacktrace --warning-mode all > "$log" 2>&1 || code=$?
          grep 'ANCHOR RENDER TEST' "$log" || true
          if [ "$code" -ne 0 ] || ! grep -q 'ANCHOR RENDER TEST PASSED' "$log"; then
            echo "The game ended with code $code. The end of its log:"
            tail -100 "$log"
            exit 1
          fi
          python3 .github/scripts/render_check.py anchor-neoforge/build/render-test/anchor-render-test

      - name: Upload render test pictures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: render-test-${{ github.sha }}
          path: anchor-neoforge/build/render-test/anchor-render-test/
          if-no-files-found: ignore

      - name: Upload mod jar
        uses: actions/upload-artifact@v6
        with:
          name: anchor-${{ github.sha }}
          path: anchor-neoforge/build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.sha }}
          path: '**/build/reports/tests/'
