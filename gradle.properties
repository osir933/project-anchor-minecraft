org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod_id=anchor
mod_name=Anchor
mod_license=MIT
mod_version=0.0.1
mod_group_id=io.github.osir933.anchor
mod_authors=osir933 and the Anchor contributors
mod_description=A deterministic, multiscale physical world for Minecraft. Matter, energy and forces are simulated with real physical laws, and tools, machines and industry emerge from them.

# Minecraft and NeoForge
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
# NeoForge for 26.3 is in beta; pin an exact build and move to the stable line when it ships.
neo_version=26.3.0.41-beta
neo_version_range=[26.3,)
loader_version_range=[1,)

# Build and test dependencies
junit_version=6.1.3
