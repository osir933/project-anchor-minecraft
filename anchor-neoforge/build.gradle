plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

description = 'Anchor for NeoForge: shows the physical world through Minecraft and turns player actions into physical inputs.'

evaluationDependsOn(':anchor-core')
def core = project(':anchor-core')

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            // The core's classes are part of this mod at runtime, not a separate library.
            sourceSet sourceSets.main
            sourceSet core.sourceSets.main
        }
    }
}

dependencies {
    // Compile against the core only; its classes are shipped inside this mod's jar (see `jar` below).
    compileOnly core
}

// Generates META-INF/neoforge.mods.toml from src/main/templates using the values in gradle.properties.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from core.sourceSets.main.output
    manifest {
        attributes(
            'Implementation-Title': mod_name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': mod_authors
        )
    }
}
